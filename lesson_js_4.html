<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
  >
  <meta
    http-equiv="X-UA-Compatible"
    content="ie=edge"
  >
  <title>Урок 4</title>
</head>
<body>
  <script>
    let chet = 0;
    let nechet = 0;
    let sum = 0;
    for (let i = 1; i <= 10; i++) {
      let number = parseInt(prompt(`Введите ${i} число `));
      if (number % 2 === 0) {
        chet++;
      } else {
        nechet++;
      }
      sum += number;
    }
    let avg = sum / 10;
    alert( `Количество четных чисел: $(chet); Количество нечетных чисел: $(nechet); Сумма всех чисел: $(sum); Среднее значние: $(avg)`);
  </script>
</body>
</html>

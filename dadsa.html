<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
  >
  <meta
    http-equiv="X-UA-Compatible"
    content="ie=edge"
  >
  <title>Document</title>
</head>
<body>
  <script>
    let strings = [
      "апельсин123",
      "банан 456",
      "игрушка7",
      "ёжик",
      "улитка99",
      "яблоко",
      "обезьяна 5",
      "энциклопедия2023",
      "арбуз_8",
      "арбуз",
      "дыня42"
    ]

    const result = strings.filter((e) => {
      let hasDigit = false

      for (let i = 0; i < e.length; i++) {
        if (e[i] >= 0 && e[i] <= 9) {
          hasDigit = true
          break
        }
      }
      return e.startsWith("а") && !e.includes(" ") && hasDigit
    })

    alert(result)


    let numbers = [1, 2, 1, 3, 3, 2, 4, 5, 6, 6, 7, 5, 8, 9, 1];
    let numbersUnique = []
    for (let i = 0; i < numbers.length; i++) {
      for (let j = i + 1; j < numbers.length; j++) {
        if (numbers[i] === numbers[j] && !numbersUnique.includes(numbers[i])) {
          numbersUnique.push(numbers[i])
          break;
        }
      }
    }

    alert(numbersUnique)

  </script>
</body>
</html>

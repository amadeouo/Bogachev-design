<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
  >
  <meta
    http-equiv="X-UA-Compatible"
    content="ie=edge"
  >
  <title>Document</title>
</head>
<body>
  <script>
    let isRunning = true
    while (isRunning) {
      const tariffType = prompt(
        `
        Выберите тип тарифа:
        1 - Минутный (10 руб./мин, мин. 100 руб.)
        2 - Часовой (500 руб./час, скидка за время)
        3 - Суточный (2000 руб./сутки, скидка за дни)
        `
      );

      let durationStr = prompt(
        "Введите длительность проката (в минутах, часах или сутках в зависимости от тарифа):"
      );
      let duration = parseFloat(durationStr);

      if (Number.isNaN(duration) || duration <= 0) {
        alert("Ошибка: введите корректную длительность!");
      } else {
        let baseCost = 0;
        let tariffText = "";

        if (tariffType === "1") {
          tariffText = "Минутный";
          baseCost = duration * 10;

          if (baseCost < 100) {
            baseCost = 100;
          }

        } else if (tariffType === "2") {
          tariffText = "Часовой";
          const fullHours = Math.ceil(duration);
          let total = 0;

          for (let i = 1; i <= fullHours; i++) {
            if (i === 1) {
              total += 500;
            } else {
              total += Math.max(500 - (i - 1) * 50, 300);
            }
          }

          baseCost = total;

        } else if (tariffType === "3") {
          tariffText = "Суточный";
          const fullDays = Math.ceil(duration);
          let total = 0;

          for (let i = 1; i <= fullDays; i++) {
            if (i === 1) {
              total += 2000;
            } else {
              const dayPrice = Math.max(2000 - (i - 1) * 200, 1000);
              total += dayPrice;
            }
          }
          baseCost = total;
        } else {
          alert("Ошибка: выберите тариф 1, 2 или 3!");
          isRunning = false;
        }
        let discountPercent = 0;

        const isHourlyLong = tariffType === "2" && duration > 3;
        const isDailyLong = tariffType === "3" && duration > 1;

        if (isHourlyLong || isDailyLong) {
          discountPercent += 10;
        }

        const isWeekend = confirm("Прокат в выходной день?");
        if (isWeekend) {
          discountPercent += 15;
        }

        if (discountPercent > 25) {
          discountPercent = 25;
        }

        const discountAmount = baseCost * (discountPercent / 100);

        const finalCost = baseCost - discountAmount;

        const result =
          `
          РАСЧЕТ ПРОКАТА САМОКАТА:
          Тариф: ${tariffText}
          Длительность проката: ${duration}
          ${(tariffType === "1" ? "мин." : tariffType === "2" ? "ч." : "сут.")}
          Базовая стоимость: ${baseCost.toFixed(2)} руб.
          Скидка: ${discountAmount.toFixed(2)} руб.
          ИТОГО К ОПЛАТЕ: ${finalCost.toFixed(2)} руб.
        `
        alert(result);
        isRunning = false;
      }
    }


  </script>

</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
  >
  <meta
    http-equiv="X-UA-Compatible"
    content="ie=edge"
  >
  <title>третья пара</title>
</head>
<body>
  <script>
    function first(val1, val2) {
      if (val1 > val2) {
        return val1;
      } else {
        return val2;
      }
    }

    function second(val1) {
      return val1 % 2 === 0
    }
    second(2)

    function third(weight, distance, isExpress = false, isFragile = false) {
      let basePrice = 0

      if (weight < 1) { basePrice += 100 }
      if (weight < 5) { basePrice += 200 }
      if (weight < 10) { basePrice += 300 }
      if (weight >= 10) { basePrice += 400 + (weight - 10) * 20 }
      if (distance > 10) { basePrice += (distance - 10) * 5}
      if (isExpress) { basePrice *= 2 }
      if (isFragile) { basePrice += 150 }

      return basePrice
    }

    console.log(third(12, 13, false, true))

    function calc(value = 0) {
      let result = value

      function sum(number) {
        result += number
        return this
      }

      function razn(number) {
        result -= number
        return this
      }

      function del(number) {
        if (number === 0) {
          console.log('Ошибка деления на ноль')
          return this
        }
        result /= number
        return this
      }

      function multiply(number) {
        result *= number
        return this
      }

      function getResult() {
        return result
      }

      function reset() {
        result = value
        return this
      }
      return {
        sum: sum,
        del: del,
        razn: razn,
        multiply: multiply,
        getResult: getResult,
        reset: reset,
      }
    }

    const num = calc(100)

    console.log(num.del(2).getResult())

  </script>
</body>
</html>

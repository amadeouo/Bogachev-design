<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
  >
  <meta
    http-equiv="X-UA-Compatible"
    content="ie=edge"
  >
  <script src="https://cdn.plot.ly/plotly-3.4.0.min.js"></script>
  <title>Document</title>
</head>
<body>
  <div id="box"></div>
  <div id="box1"></div>
  <div id="box2"></div>
  <script>
    const data = [{
      values: [7.2, 32.9, 24.4, 19, 9, 7.4],
      labels: ['Berry Bursts', 'Mocha Marvels', 'Caramel Swirls', "PB Bliss", "Choco Chippers", "Mint melts"],
      type: 'pie',
      textinfo: "label+percent",
      textposition: "outside",
      marker: {
        line: {
          color: "#FFF",
          width: 2,
        }
      }
    }];

    const layout = {
      title: {
        text: "Cookie Market Share 2023"
      },
      showlegend: false,
    };

    Plotly.newPlot("box", data, layout);

    const data1 = [{
      x: ['Liam', 'Sophie', 'Jacob', 'Mia', 'William', 'Olivia'],
      y: [8.0, 8.0, 12.0, 12.0, 13.0, 20.0],
      type: 'bar',
      text: ['4.17 below the mean', '4.17 below the mean', '0.17 below the mean', '0.17 below the mean', '0.83 above the mean', '7.83 above the mean'],
      marker: {
        color: 'rgb(142,124,195)'
      }
    }];

    const layout1 = {
      title: {
        text: 'Number of Graphs Made this Week'
      },
      font:{
        family: 'Raleway, sans-serif'
      },
      showlegend: false,
      xaxis: {
        tickangle: -45
      },
      yaxis: {
        zeroline: false,
        gridwidth: 2
      },
      bargap: 0.05
    };

    Plotly.newPlot('box1', data1, layout1);

    const trace1 = {
      x: [ "January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
      y: [36, 27, 42, 51, 69, 81, 80, 82, 77, 69, 45, 38],
      mode: "lines",
      line: {
        color: "red",
        dash: "dash",
      }
    }

    const trace2 = {
      x: [ "January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"],
      y: [31, 37, 50, 51, 69, 72, 73, 74, 70, 61, 47, 30],
      mode: "lines",
      line: {
        color: "red",
        dash: "dot",
      }
    }

    const data2 = [trace1, trace2]

    const layout2 = {

    }

    Plotly.newPlot("box2", data2, layout2)
  </script>
</body>
</html>

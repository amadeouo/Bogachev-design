<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
  >
  <meta
    http-equiv="X-UA-Compatible"
    content="ie=edge"
  >

  <title>Document</title>
</head>
<body>
<!--
  объявляем переменную логического типа, которая изначально имеет значение тру
внутри цикла , пока переменная логичекого цикла явлется тру создается переменная секретного числа через математическйи рандом в диапозоне от 1 до 100, с округлением в меньшую сторону создается переменная кол-во попыток и ей присвается значение 5
дальше пользователю выдается сообщение я загадал число от 1 до 100 у тебя столько то попыток
внутри этого основного цикла пока кол-во попыток больше 0 создается новая переменная, в которую будут вписаны значения с клавиатуры из этой переменной с клавы убудт выниматься целочисленные значени, а сам вопрос будет звучать так попытка такая то из 5 ввведите число
дальше осуществляется проверка является ли введенное значение числовым не меньше ли оно 1 и не больше ли 100
если хотя бы одно из этих условий выполняется то выдется сообщение введите корректные данные
новая проверка - если введенное число ровняется загаданному , выдется сообщение - поздравляю, вы угадалаи число такое-то, за столько то поппыток
цикл принудительно прекращается
иначе счетчик поппыток уменьшается на единицу, создается новая переменная как математический модуль разницы введенного и загаданного числа, создается новая переменная тенарного типа, в которой осущ проверка - явлется ли введенное число больбше загаданного
если да - большое
если нет -  напишет маленькое
новая проверка - если разница меньше либо равна 5, то к переменной тенарноси добавляется доп надпись - горячо
если разница больше 20, то добавляется надпись - холодно
во всех остальных случаях будет написано тепло
новая проверка - если кол-во поппыток больше 0 выдется сообщение - две строки - первая что-то, вторая - остальнось поппыток столько -то
иначе первая строка остается такой же, а вторая - поппытки закончились загаданное число такое
перед выходом из общего цикла наша первая переменная будет представленная в виде переменной конфирм - и вопрос звучит так - хотите сыграть еще
и в самом конце спасибо за игру досвидания
 -->

  <script defer>
    let playAgain = true;

    while (playAgain) {
      const secretNumber = Math.floor(Math.random() * 100) + 1;
      let attemptsLeft = 5;

      alert(`Я загадал число от 1 до 100. У тебя ${attemptsLeft} попыток.`);

      while (attemptsLeft > 0) {
        const userInput = prompt(`Попытка ${6 - attemptsLeft} из 5. Введите число:`);
        const userNumber = parseInt(userInput, 10);

        if (isNaN(userNumber) || userNumber < 1 || userNumber > 100) {
          alert("Введите корректные данные (число от 1 до 100).");
          continue;
        }

        if (userNumber === secretNumber) {
          alert(`Поздравляю! Вы угадали число ${secretNumber} за ${6 - attemptsLeft} попыток.`);
          break;
        } else {
          attemptsLeft--;
          const difference = Math.abs(userNumber - secretNumber);
          let hint = userNumber > secretNumber ? "большое" : "маленькое";

          if (difference <= 5) {
            hint += ", горячо";
          } else if (difference > 20) {
            hint += ", холодно";
          } else {
            hint += ", тепло";
          }

          if (attemptsLeft > 0) {
            alert(`${hint}. Осталось попыток: ${attemptsLeft}.`);
          } else {
            alert(`${hint}. Попытки закончились. Загаданное число было ${secretNumber}.`);
          }
        }
      }

      playAgain = confirm("Хотите сыграть еще?");
    }

    alert("Спасибо за игру! До свидания.");
  </script>
</body>
</html>

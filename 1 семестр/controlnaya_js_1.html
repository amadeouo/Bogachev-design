<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
  >
  <meta
    http-equiv="X-UA-Compatible"
    content="ie=edge"
  >
  <title>Document</title>
</head>
<body>
  <script defer>
    let weightInput = prompt("Введите вес посылки (кг):");
    let weight = parseFloat(weightInput?.replace(",", "."));

    let distanceInput = prompt("Введите расстояние доставки (км):");
    let distance = parseFloat(distanceInput?.replace(",", "."));

    if (
      Number.isNaN(weight) ||
      Number.isNaN(distance) ||
      weight <= 0 ||
      distance <= 0
    ) {
      alert("Ошибка: введите корректные данные!");
    } else {
      const baseCost = weight * 50 + distance * 20;

      let discount = 0;

      if (weight > 10) {
        discount += 15;
      }
      if (distance > 100) {
        discount += 10;
      }

      // 8) Итоговая стоимость с учетом скидки
      const finalCost = baseCost * (1 - discount / 100);

      const message =
        `
        Вес: ${weight} кг, расстояние: ${distance} км
        Базовая стоимость: ${baseCost.toFixed(2)} руб.
        Скидка: ${discount} %
        Итоговая стоимость: ${finalCost.toFixed(2)} руб.
        `
      alert(message);
    }
  </script>
</body>
</html>
